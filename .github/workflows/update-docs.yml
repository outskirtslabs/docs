# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: update projects

on:
  schedule:
    - cron: "0 06 ? * MON"
  workflow_dispatch:

concurrency:
  group: update-projects-nix
  cancel-in-progress: false

jobs:
  update-projects-nix:
    name: Update projects.nix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://cache.garnix.io
            extra-trusted-public-keys = cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr9g=
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: DeterminateSystems/flake-checker-action@v12

      - name: Update projects.nix
        run: nix develop .#ci --command -- bb projects.nix

      - name: Commit and open PR if projects.nix changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -Eq '^[[:space:]]*"[^"]+"[[:space:]]*=[[:space:]]*{' pkgs/projects.nix; then
            echo "Refusing to continue: pkgs/projects.nix has no project entries"
            exit 1
          fi

          if git diff --quiet -- pkgs/projects.nix; then
            echo "No changes to pkgs/projects.nix"
            exit 0
          fi

          git config --global user.name "Casey Link"
          git config --global user.email "14830+Ramblurr@users.noreply.github.com"

          # Reuse the oldest open update PR, including legacy date-named branches.
          PR="$(gh pr list --base main --state open --limit 1000 \
            --json number,headRefName,isCrossRepository,createdAt \
            --jq '[.[] | select(.isCrossRepository == false) |
              select(.headRefName == "auto-update/projects-nix" or
                (.headRefName | startswith("auto-update/projects-nix-")))] |
              sort_by(.createdAt) | first // empty')"
          PR_NUMBER="$(jq -r '.number // empty' <<< "$PR")"
          BRANCH="$(jq -r '.headRefName // empty' <<< "$PR")"
          BRANCH="${BRANCH:-auto-update/projects-nix}"

          # Compare evaluated project entries with main, not the previous update run.
          BASE_FILE="$(mktemp --suffix=.nix)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BASE_FILE" "$BODY_FILE"' EXIT
          git show HEAD:pkgs/projects.nix > "$BASE_FILE"
          BASE_JSON="$(nix eval --json --file "$BASE_FILE")"
          UPDATED_JSON="$(nix eval --json --file pkgs/projects.nix)"
          {
            printf 'Automated update of `pkgs/projects.nix` via `bb projects.nix`.\n\nUpdated projects:\n\n'
            jq -nr --argjson base "$BASE_JSON" --argjson updated "$UPDATED_JSON" '
              (($base | keys) + ($updated | keys) | unique)[] as $name |
              select($base[$name] != $updated[$name]) | "- \($name)"'
          } > "$BODY_FILE"

          # Record the remote tip so the lease protects against concurrent edits.
          EXPECTED="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          git checkout -B "$BRANCH"
          git add pkgs/projects.nix
          git commit -m "update projects.nix"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED" origin "$BRANCH"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"
            gh pr comment "$PR_NUMBER" --body \
              "Updated this PR with the latest project pins: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          else
            gh pr create \
              --title "update projects.nix" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$BRANCH"
            PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi

          REVIEWER="Ramblurr"
          if gh pr view "$PR_NUMBER" --json reviewRequests --jq '.reviewRequests[].login' | grep -qx "$REVIEWER"; then
            echo "Reviewer already requested: $REVIEWER"
          else
            gh pr edit "$PR_NUMBER" --add-reviewer "$REVIEWER"
            echo "Requested reviewer: $REVIEWER"
          fi
